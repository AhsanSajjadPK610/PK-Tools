<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age Calculator - PK Tools</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.header{background:linear-gradient(135deg,#26bcff,#0041cc);color:#fff;padding:15px;text-align:center}
.box{max-width:500px;margin:30px auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);text-align:center}
input{width:90%;padding:14px;border-radius:10px;border:2px solid #e1e8ff}
button{background:linear-gradient(135deg,#26bcff,#0041cc);color:#fff;border:0;padding:14px 25px;border-radius:10px;font-weight:bold;width:95%;margin-top:10px}
#out{margin-top:15px;font-size:18px;font-weight:bold}
a{color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="header"><a href="index.html">⬅ Back</a> | Age Calculator 🎂</div>
<div class="box">
<h2>Apni Age Maloom Karo</h2>
<input type="date" id="dob">
<button onclick="calc()">Age Dekho</button>
<div id="out"></div>
</div>
<script>
function calc(){
let d=document.getElementById('dob').value;if(!d){alert('Date select karo!');return;}
let b=new Date(d),n=new Date(),a=n.getFullYear()-b.getFullYear();
if(n.getMonth()<b.getMonth()||(n.getMonth()==b.getMonth()&&n.getDate()<b.getDate()))a--;
document.getElementById('out').innerText=`Tumhari Age ${a} Saal hai 🎉`;
}
</script>
</body>
</html>
