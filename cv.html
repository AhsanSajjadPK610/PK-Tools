<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Maker - PK Tools</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.header{background:#111;color:#fff;padding:12px 15px;font-weight:bold;display:flex;justify-content:space-between}
.header a{color:#fff;text-decoration:none}
.wrap{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.1);margin-bottom:20px;cursor:pointer}
.card-body{padding:12px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.card-body b{font-size:16px}
.card-body span{background:#111;color:#FFD700;padding:6px 12px;border-radius:20px;font-size:13px}
#editor{display:none}
.formBox{background:#fff;padding:15px;border-radius:12px}
.formBox input,.formBox textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.btn{padding:12px;border:0;border-radius:8px;font-weight:bold;width:100%;margin-top:8px}
.btn-print{background:#111;color:#fff}
.btn-back{background:#eee;color:#111}
.cv{padding:25px;min-height:600px;border-radius:12px}
@media print{.header,.formBox,.btn-back,h2{display:none}}
</style>
</head>
<body>
<div class="header"><a href="index.html">⬅ Back</a><span>CV Maker</span><span></span></div>

<div class="wrap" id="list">
<h2>Template Select Karo</h2>

<div class="card" onclick="openEditor(2)">
<div style="background:#1e1e1e;color:#FFD700;padding:40px;text-align:center">
<h1 style="margin:0">AYESHA KHAN</h1>
<p>Marketing Manager | Elegant Black Gold</p>
</div>
<div class="card-body"><b>No 2 - Black Gold</b><span>Use This →</span></div>
</div>

<div class="card" onclick="openEditor(3)">
<div style="background:#fff;padding:30px;border-top:5px solid #00b09b">
<h2 style="margin:0">Sarah Malik</h2>
<p style="color:#666">Software Engineer | Clean Minimalist</p>
</div>
<div class="card-body"><b>No 3 - Clean Minimalist</b><span>Use This →</span></div>
</div>
</div>

<div class="wrap" id="editor">
<button class="btn btn-back" onclick="closeEditor()">⬅ Wapis</button>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px" id="grid">
<div class="formBox">
<h3>Detail Bharo</h3>
<input id="name" placeholder="Naam" oninput="update()">
<input id="job" placeholder="Job Title" oninput="update()">
<input id="phone" placeholder="Phone" oninput="update()">
<input id="email" placeholder="Email" oninput="update()">
<input id="city" placeholder="City" oninput="update()">
<textarea id="about" placeholder="About Me" oninput="update()"></textarea>
<textarea id="exp" placeholder="Experience" oninput="update()"></textarea>
<textarea id="skills" placeholder="Skills" oninput="update()"></textarea>
<textarea id="edu" placeholder="Education" oninput="update()"></textarea>
<button class="btn btn-print" onclick="window.print()">💾 Save / Print PDF</button>
</div>
<div id="previewBox"></div>
</div>
</div>

<script>
let current=2;
function openEditor(n){current=n;document.getElementById('list').style.display='none';document.getElementById('editor').style.display='block';update();}
function closeEditor(){document.getElementById('editor').style.display='none';document.getElementById('list').style.display='block';}
function update(){
let name=document.getElementById('name').value||'Ayesha Khan';
let job=document.getElementById('job').value||'Marketing Manager';
let phone=document.getElementById('phone').value||'+92 321 9876543';
let email=document.getElementById('email').value||'ayesha@email.com';
let city=document.getElementById('city').value||'Karachi';
let about=document.getElementById('about').value||'Creative professional with 6+ years experience...';
let exp=document.getElementById('exp').value||'Khaadi - Manager 2022-Present';
let skills=document.getElementById('skills').value||'Digital Marketing, SEO';
let edu=document.getElementById('edu').value||'BBA - IBA 2019';
let html='';
if(current==2){html=`<div class="cv" style="background:#1e1e1e;color:#FFD700"><h1 style="color:#FFD700">${name}</h1><p>${job} | ${city}</p><hr style="border-color:#FFD700"><p>📞 ${phone}<br>✉️ ${email}</p><h3 style="color:#FFD700">PROFILE</h3><p style="color:#ddd">${about}</p><h3 style="color:#FFD700">EXPERIENCE</h3><p style="color:#ddd;white-space:pre-line">${exp}</p><h3 style="color:#FFD700">SKILLS</h3><p style="color:#ddd">${skills}</p><h3 style="color:#FFD700">EDUCATION</h3><p style="color:#ddd">${edu}</p></div>`;}
else{html=`<div class="cv" style="background:#fff;color:#222;border:1px solid #ddd"><h1>${name}</h1><p>${job}</p><p>📞 ${phone} | ✉️ ${email} | 📍 ${city}</p><hr><h3>ABOUT</h3><p>${about}</p><h3>EXPERIENCE</h3><p style="white-space:pre-line">${exp}</p><h3>SKILLS</h3><p>${skills}</p><h3>EDUCATION</h3><p>${edu}</p></div>`;}
document.getElementById('previewBox').innerHTML=html;
}
</script>
</body>
</html>
