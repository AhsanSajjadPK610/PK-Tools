<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stylish Name - PK Tools</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.header{background:linear-gradient(135deg,#26bcff,#0041cc);color:#fff;padding:15px;text-align:center}
.box{max-width:500px;margin:30px auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);text-align:center}
input{width:90%;padding:14px;border-radius:10px;border:2px solid #e1e8ff}
button{background:linear-gradient(135deg,#26bcff,#0041cc);color:#fff;border:0;padding:14px 25px;border-radius:10px;font-weight:bold;width:95%;margin-top:10px}
#out{margin-top:15px;text-align:left}
.style{padding:10px;border:1px solid #eee;border-radius:8px;margin:5px 0}
a{color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="header"><a href="index.html">⬅ Back</a> | Stylish Name ✨</div>
<div class="box">
<h2>VIP Name Banao</h2>
<input id="n" placeholder="Apna naam likho e.g. Ahsan">
<button onclick="styleName()">Style Banao</button>
<div id="out"></div>
</div>
<script>
function styleName(){
let v=document.getElementById('n').value.trim();if(!v){alert('Naam likho!');return;}
let s=[`꧁༒☬ ${v} ☬༒꧂`,`𝕯𝖆𝖗𝖐 ${v} 𝕯𝖆𝖗𝖐`,`★彡[${v}]彡★`,`『${v}』ᴳᵒᵈ`,`༺ ${v} ༻`];
document.getElementById('out').innerHTML=s.map(x=>`<div class="style">${x}</div>`).join('');
}
</script>
</body>
</html>
