<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password - PK Tools</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.header{background:linear-gradient(135deg,#26bcff,#0041cc);color:#fff;padding:15px;text-align:center}
.box{max-width:500px;margin:30px auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);text-align:center}
button{background:linear-gradient(135deg,#26bcff,#0041cc);color:#fff;border:0;padding:14px 25px;border-radius:10px;font-weight:bold;width:95%;font-size:18px}
#out{font-size:20px;font-weight:bold;margin:20px 0;background:#f0f2f5;padding:15px;border-radius:10px;word-break:break-all}
a{color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="header"><a href="index.html">⬅ Back</a> | Password 🔑</div>
<div class="box">
<h2>Strong Password Banao</h2>
<div id="out">Click karo password ke liye</div>
<button onclick="gen()">Generate Password</button>
<button onclick="navigator.clipboard.writeText(document.getElementById('out').innerText);alert('Copy ho gaya!')" style="background:#000;margin-top:10px">Copy Karo</button>
</div>
<script>
function gen(){
let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!";let p="";
for(let i=0;i<14;i++)p+=c.charAt(Math.floor(Math.random()*c.length));
document.getElementById('out').innerText=p;
}
gen();
</script>
</body>
</html>
