<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LISA AI - PK-TOOLS</title>
<style>
body{margin:0;font-family:'Segoe UI',Arial;background:#f0f2f5;display:flex;flex-direction:column;height:100vh}
.header{background:linear-gradient(135deg,#ff3e9d,#7b2cff);color:#fff;padding:16px;text-align:center;font-weight:bold;font-size:18px}
.header a{color:#fff;text-decoration:none;float:left}
#chat{flex:1;overflow-y:auto;padding:15px;max-width:700px;margin:0 auto;width:95%;box-sizing:border-box}
.msg{padding:13px 18px;border-radius:20px;margin:10px 0;max-width:82%;line-height:1.5;word-wrap:break-word;font-size:15px}
.user{background:linear-gradient(135deg,#26bcff,#0041cc);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bot{background:#fff;color:#222;box-shadow:0 3px 10px rgba(0,0,0,.08);border-bottom-left-radius:6px}
.input-area{display:flex;gap:10px;padding:12px;background:#fff;border-top:1px solid #eee;max-width:700px;margin:0 auto;width:100%;box-sizing:border-box;position:sticky;bottom:0}
.input-area input{flex:1;padding:14px 18px;border-radius:25px;border:2px solid #e1e8ff;outline:none;font-size:15px}
.input-area button{background:linear-gradient(135deg,#ff3e9d,#7b2cff);color:#fff;border:0;padding:14px 24px;border-radius:25px;font-weight:900}
.typing{font-style:italic;color:#888;background:#fff;padding:10px 18px;border-radius:20px;width:fit-content}
</style>
</head>
<body>
<div class="header"><a href="index.html">⬅</a> LISA - Tumhari AI Dost 💜</div>
<div id="chat"></div>
<div class="input-area">
<input id="inp" placeholder="Kuch likho..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
<script>
let memory = JSON.parse(localStorage.getItem('lisa_memory') || '{"name":"","facts":[]}');
let chatDiv = document.getElementById('chat');

function showMsg(text, who){
chatDiv.innerHTML+=`<div class='msg ${who}'>${text}</div>`;
chatDiv.scrollTop=chatDiv.scrollHeight;
}

function init(){
if(memory.name){
showMsg(`Welcome back ${memory.name}! 😊 Kya haal hai?`, 'bot');
}else{
showMsg(`Hi! Main LISA hun 😊 Tumhara naam kya hai?`, 'bot');
}
}
init();

async function send(){
let i=document.getElementById('inp');
let t=i.value.trim();
if(!t)return;
showMsg(t, 'user');
i.value='';
let lower = t.toLowerCase();

if(lower.includes('mera naam') || lower.includes('my name is')){
let name = t.replace(/mera naam|my name is|hai/gi,'').trim().split(' ').pop();
memory.name = name.charAt(0).toUpperCase() + name.slice(1);
localStorage.setItem('lisa_memory', JSON.stringify(memory));
showMsg(`Nice! Yaad rakh liya, tumhara naam ${memory.name} hai 😍 Ab se ${memory.name} bulaungi!`, 'bot');
return;
}

if(lower.includes('yaad rakhna') || lower.includes('yaad rakh')){
let fact = t.replace(/yaad rakhna|yaad rakh|ye/gi,'').trim();
if(fact.length>2){
memory.facts.push(fact);
localStorage.setItem('lisa_memory', JSON.stringify(memory));
showMsg(`Ok ${memory.name || 'dost'}! Save kar liya: "${fact}" ✅`, 'bot');
}
return;
}

let id='t'+Date.now();
chatDiv.innerHTML+=`<div class='msg bot typing' id='${id}'>LISA likh rahi hai...✍️</div>`;
chatDiv.scrollTop=chatDiv.scrollHeight;
try{
let userName = memory.name ? `User ka naam ${memory.name} hai, is naam se bulao.` : `User ne naam nahi bataya, to pyar se dost bulao.`;
let context = `Tum LISA ho, PK-TOOLS ki AI dost. ${userName} Tumhe ye yaad hai: ${memory.facts.join(', ')}. Roman Urdu me short jawab do. User: ${t}`;
let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(context));
let d=await r.text();
document.getElementById(id).remove();
showMsg(d, 'bot');
}catch(e){
document.getElementById(id).remove();
showMsg(`Net slow hai, dubara bolo 😅`, 'bot');
}
}
</script>
</body>
</html>
