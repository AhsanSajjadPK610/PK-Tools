<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LISA</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5;display:flex;flex-direction:column;height:100vh}
.header{background:linear-gradient(135deg,#ff3e9d,#7b2cff);color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;font-weight:bold}
.header a{color:#fff;text-decoration:none}
.iconBtn{background:rgba(255,255,255,.25);border:0;color:#fff;width:36px;height:36px;border-radius:50%;margin-left:5px}
#chat{flex:1;overflow-y:auto;padding:15px;max-width:700px;margin:0 auto;width:95%;box-sizing:border-box}
.msg{padding:12px 16px;border-radius:18px;margin:8px 0;max-width:80%;font-size:15px;line-height:1.5}
.user{background:#0084ff;color:#fff;margin-left:auto}
.bot{background:#fff;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.input-area{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #eee;max-width:700px;margin:0 auto;width:100%;box-sizing:border-box;position:sticky;bottom:0}
.input-area input{flex:1;padding:12px 15px;border-radius:20px;border:2px solid #ddd;outline:none}
.input-area button{border:0;width:44px;height:44px;border-radius:50%;color:#fff;font-size:18px}
#sendBtn{background:#ff3e9d}
#micBtn{background:#111}
#micBtn.on{background:red}
#callScreen{display:none;position:fixed;inset:0;background:#111;z-index:9999;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.typing span{width:6px;height:6px;background:#999;border-radius:50%;display:inline-block;margin:0 2px;animation:b 1.2s infinite}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div id="callScreen">
<img src="https://i.pravatar.cc/150?img=5" style="width:100px;height:100px;border-radius:50%;border:3px solid #ff3e9d">
<h2>LISA 💜</h2>
<p id="callText" style="font-size:18px;margin:15px">Calling...</p>
<p id="callMicText" style="background:#222;padding:8px 15px;border-radius:15px;font-size:13px">Mic ready</p>
<button onclick="endCall()" style="margin-top:25px;background:#ff3040;color:#fff;border:0;width:65px;height:65px;border-radius:50%;font-size:24px">📵</button>
</div>

<div class="header"><a href="index.html">⬅</a><span>LISA 💜</span><div><button class="iconBtn" onclick="alert('Memory: '+(memory.name||'koi nahi'))">🧠</button><button class="iconBtn" onclick="startCall()">📞</button></div></div>
<div id="chat"></div>
<div class="input-area">
<button id="micBtn" onclick="voiceChat()">🎙️</button>
<input id="inp" placeholder="Kuch likho..." onkeypress="if(event.key==='Enter')sendMsg()">
<button id="sendBtn" onclick="sendMsg()">➤</button>
</div>

<script>
let memory=JSON.parse(localStorage.getItem('lisa_memory')||'{"name":"","facts":[]}');
let chatDiv=document.getElementById('chat');
let isCall=false;
let recCall=null;

function addMsg(t,w){chatDiv.innerHTML+=`<div class='msg ${w}'>${t}</div>`;chatDiv.scrollTop=chatDiv.scrollHeight;}

if(memory.name){addMsg('Welcome back '+memory.name+'! 😊','bot');}else{addMsg('Hi! Main LISA hun 😊 Naam kya hai?','bot');}

// VOICE CHAT BUTTON (neeche wala)
function voiceChat(){
if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert('Chrome me kholo bhai');return;}
let btn=document.getElementById('micBtn');
let r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
r.lang='hi-IN';
btn.classList.add('on');btn.innerText='🔴';
r.onresult=e=>{
document.getElementById('inp').value=e.results[0][0].transcript;
sendMsg();
};
r.onend=()=>{btn.classList.remove('on');btn.innerText='🎙️';};
r.onerror=()=>{btn.classList.remove('on');btn.innerText='🎙️';alert('Mic allow karo upar se');};
r.start();
}

// CALL SYSTEM - REAL CALL JESA
function startCall(){
isCall=true;
document.getElementById('callScreen').style.display='flex';
document.getElementById('callText').innerText='Ringing...';
setTimeout(()=>{speakCall(`Hello ${memory.name||'dost'}! bolo kya baat hai?`);},800);
}
function endCall(){
isCall=false;
if(recCall){try{recCall.stop();}catch(e){}}
speechSynthesis.cancel();
document.getElementById('callScreen').style.display='none';
addMsg('Call end 💜','bot');
}
function speakCall(txt){
document.getElementById('callText').innerText=txt;
document.getElementById('callMicText').innerText='🔊 Bol rahi hun...';
let u=new SpeechSynthesisUtterance(txt);
let voices=speechSynthesis.getVoices();
let girl=voices.find(v=>v.name.includes('Google')&&v.lang.includes('hi'))||voices[0];
if(girl)u.voice=girl;
u.lang='hi-IN';u.rate=0.9;u.pitch=1.4;
speechSynthesis.cancel();
u.onend=()=>{if(isCall){listenCall();}};
speechSynthesis.speak(u);
}
function listenCall(){
if(!isCall)return;
document.getElementById('callMicText').innerText='🎙️ Sun rahi hun... bolo';
if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){document.getElementById('callMicText').innerText='Chrome me kholo';return;}
recCall=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
recCall.lang='hi-IN';
recCall.onresult=async e=>{
let userSaid=e.results[0][0].transcript;
document.getElementById('callText').innerText='Tum: '+userSaid;
document.getElementById('callMicText').innerText='💭 Jawab soch rahi...';
try{
let prompt=`Tum LISA ho, call pe pyari larki, short Roman Urdu jawab do. User: ${userSaid}`;
let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));
let ans=await res.text();
speakCall(ans);
}catch(err){speakCall('Dobara bolo, awaz sahi nahi ayi');}
};
recCall.onerror=()=>{if(isCall)setTimeout(listenCall,1000);};
recCall.start();
}

async function sendMsg(){
let inp=document.getElementById('inp');
let t=inp.value.trim();if(!t)return;
addMsg(t,'user');inp.value='';
if(t.toLowerCase().includes('mera naam')){let n=t.split(' ').pop();memory.name=n;localStorage.setItem('lisa_memory',JSON.stringify(memory));addMsg('Ok '+n+' yaad rakh liya 💜','bot');return;}
let id='t'+Date.now();
chatDiv.innerHTML+=`<div class='msg bot' id='${id}'><span class='typing'><span></span><span></span><span></span></span></div>`;
chatDiv.scrollTop=chatDiv.scrollHeight;
try{
let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent('Tum LISA ho short Roman Urdu me jawab do. User: '+t));
let d=await res.text();
document.getElementById(id).remove();
addMsg(d,'bot');
}catch(e){document.getElementById(id).remove();addMsg('Net slow hai','bot');}
}
speechSynthesis.getVoices();
</script>
</body>
</html>
