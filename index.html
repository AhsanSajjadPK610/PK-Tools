<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK Tools - Pakistan's No.1 All in One Tools</title>
<meta name="description" content="PK Tools - Free QR Generator, Image to PDF, Free Fire Stylish Name, Password Generator for Pakistan">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI', sans-serif}
body{background:#f0f5ff;color:#222}
.header{background: linear-gradient(135deg,#2b6cff,#0041cc);color:#fff;padding:35px 15px;text-align:center}
.header h1{font-size:32px;letter-spacing:1px}
.header p{opacity:.9;margin-top:8px;font-size:16px}
.container{max-width:1100px;margin:auto;padding:15px}
.grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:20px}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}.header h1{font-size:42px}}
@media(min-width:1024px){.grid{grid-template-columns:1fr 1fr 1fr}.header{padding:50px 15px}}
.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 8px 25px rgba(43,108,255,.12);transition:.2s;border-top:4px solid #2b6cff}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 35px rgba(43,108,255,.2)}
.card h2{font-size:19px;color:#1a3f99;margin-bottom:12px;display:flex;align-items:center;gap:8px}
input{width:100%;padding:13px;border:2px solid #e1e8ff;border-radius:10px;outline:none;font-size:15px}
input:focus{border-color:#2b6cff}
button{width:100%;background:#2b6cff;color:#fff;border:0;padding:13px;border-radius:10px;margin-top:12px;font-weight:bold;font-size:15px;cursor:pointer;transition:.2s}
button:hover{background:#1a4fcc}
button:active{transform:scale(.98)}
.result{margin-top:14px;background:#f3f7ff;padding:14px;border-radius:10px;text-align:center;word-break:break-all;min-height:45px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.footer{text-align:center;padding:30px 10px;color:#666;font-size:14px}
</style>
</head>
<body>
<div class="header">
<h1>PK TOOLS 🇵🇰</h1>
<p>Pakistan's Fastest All-in-One Tools - 100% Free & Mobile Friendly</p>
</div>
<div class="container">
<div class="grid">
<div class="card">
<h2>📱 QR Generator</h2>
<input id="qrText" placeholder="YouTube / WhatsApp Link dalo...">
<button onclick="makeQR()">QR Code Banao</button>
<div class="result"><img id="qrImg" style="display:none;max-width:180px;border-radius:8px"></div>
</div>
<div class="card">
<h2>🖼️ Image to PDF</h2>
<input type="file" id="imgFile" accept="image/*">
<button onclick="imgToPdf()">PDF Me Convert Karo</button>
<div id="pdfResult" class="result">JPG / PNG select karo</div>
</div>
<div class="card">
<h2>🎮 Stylish Name Maker</h2>
<input id="nameInput" placeholder="Apna Naam: ALi">
<button onclick="makeFancy()">VIP Style Banao</button>
<div id="fancyResult" class="result">Yahan Stylish naam ayenge</div>
</div>
<div class="card">
<h2>🔐 Password Generator</h2>
<p style="font-size:13px;color:#666">Hackers se safe password</p>
<button onclick="genPass()">Strong Password Banao</button>
<div id="passResult" class="result" style="font-weight:bold;letter-spacing:1px">Click karo</div>
</div>
</div>
</div>
<div class="footer">Made with ❤️ in Multan, Pakistan | PK-Tools - 2026</div>
<script>
function makeQR(){
let t=document.getElementById('qrText').value;
if(!t)return alert('Pehle link likho bhai');
let img=document.getElementById('qrImg');
img.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(t);
img.style.display='block';
}
async function imgToPdf(){
let file=document.getElementById('imgFile').files[0];
if(!file)return alert('Image select karo');
let r=new FileReader();
r.onload=function(e){
let im=new Image();
im.onload=function(){
let {jsPDF}=window.jspdf;
let pdf=new jsPDF();
pdf.addImage(im,'JPEG',10,10,190,0);
pdf.save('PK-Tools-'+Date.now()+'.pdf');
document.getElementById('pdfResult').innerText='✅ PDF Download Ho Gaya!';
}
im.src=e.target.result;
}
r.readAsDataURL(file);
}
function makeFancy(){
let n=document.getElementById('nameInput').value;
if(!n)return alert('Naam likho');
let s=['꧁༺ '+n+' ༻꧂','★彡 '+n+' 彡★','『 '+n+' 』','×͜× '+n+' ×͜×','🔥 '+n+' 🔥','👑 '+n+' 👑','💀 '+n+' 💀','ᴹᴿ° '+n+' °ᴮᴼˢˢ'];
document.getElementById('fancyResult').innerHTML=s.join('<div style=margin:6px 0;padding:8px;background:white;border-radius:6px;border:1px solid #ddd>'+'</div>').replaceAll('</div><div', '</div><div').replaceAll('><', '>'+'' ) + s.map(x=>'<div style=margin:6px 0;padding:8px;background:white;border-radius:6px;border:1px solid #ddd>'+x+'</div>').join('');
document.getElementById('fancyResult').innerHTML = s.map(x=>'<div style=margin:6px 0;padding:8px;background:white;border-radius:6px;border:1px solid #ddd;cursor:pointer' + ' onclick=navigator.clipboard.writeText(\''+x+'\')>'+x+' (Copy)</div>').join('');
}
function genPass(){
let c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*';
let p='';for(let i=0;i<14;i++)p+=c.charAt(Math.floor(Math.random()*c.length));
document.getElementById('passResult').innerText=p;
}
</script>
</body>
</html>
